x-backend-env: &backend-env
  DATABASE_URL: postgres://tcg:tcg@postgres:5432/tcg_events
  ORIGIN_QUERY: "Timisoara, Romania"
  RADIUS_KM: "500"
  SYNC_TOKEN: ${SYNC_TOKEN:-change-me}
  GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
  GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
  GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
  JWT_SECRET: ${JWT_SECRET:-change-me}
  FAB_PROXY_URL: ${FAB_PROXY_URL:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg
      POSTGRES_DB: tcg_events
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # host 5433 to avoid clashing with any other local Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      PORT: 4000
    ports:
      - "4000:4000"

  # Fetching events runs as its own process, not in-process in the backend
  # (see src/jobs/runOnce.ts) — in production this is a K8s CronJob (managed
  # directly on the server, not in this repo); here it's just this container
  # looping so local dev still gets data without a manual step. Edit the
  # sleep below to change the cadence (matches the CronJob's default of
  # every 6h).
  sync:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *backend-env
    entrypoint: ["sh", "-c"]
    command: ["while true; do node dist/jobs/runOnce.js; sleep 21600; done"]

volumes:
  postgres_data:
